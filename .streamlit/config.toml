# The navy palette the user picked (DESIGN.md section 4). Every text/background pair below keeps WCAG AA
# (4.5:1 or more): white on the primary is 8.0:1, captions 6.1:1, each status text on its background 5.7:1 or more.
[theme]
base = "light"
primaryColor = "#1F4E9A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F8"
textColor = "#1A1D23"
linkColor = "#1F4E9A"
font = "'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
headingFont = "'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
baseFontSize = 15
baseRadius = "8px"
# Status badges and alerts: 답변 green, 확인 필요 blue, 근거 부족·충돌 orange, 오류·차단 red, 취소·미상 gray.
greenColor = "#1E6B3A"
greenTextColor = "#1E6B3A"
greenBackgroundColor = "#E6F4EA"
blueColor = "#1F4E9A"
blueTextColor = "#1F4E9A"
blueBackgroundColor = "#E8F0FB"
orangeColor = "#8A4B00"
orangeTextColor = "#8A4B00"
orangeBackgroundColor = "#FFF1DC"
yellowColor = "#8A4B00"
yellowTextColor = "#8A4B00"
yellowBackgroundColor = "#FFF1DC"
redColor = "#B3261E"
redTextColor = "#B3261E"
redBackgroundColor = "#FDECEA"
grayColor = "#4A5160"
grayTextColor = "#4A5160"
grayBackgroundColor = "#EEF0F3"
violetColor = "#4A5160"
violetTextColor = "#4A5160"
violetBackgroundColor = "#EEF0F3"
headingFontSizes = ["24px", "17px", "15px"]
headingFontWeights = [700, 700, 700]

[theme.sidebar]
# The sidebar has its own heading scale (it measured 18.75px); keep section titles at 17px there too.
headingFontSizes = ["24px", "17px", "15px"]
headingFontWeights = [700, 700, 700]
