[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rfp-assistant"
version = "0.1.0"
description = "Internal RFP discovery and grounded Q&A assistant for 입찰메이트"
requires-python = ">=3.12"
# Exact pins live in requirements.txt (the lock generated from the smoke-tested environment).
dependencies = [
    "pymupdf",
    "pyhwp",
    "kiwipiepy",
    "rank_bm25",
    "openai",
    "pydantic",
    "tiktoken",
    "numpy",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pgvector==0.5.0",
    "fastapi",
    "uvicorn",
    "httpx",
    "langfuse==4.16.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Local reranker trial (phase 2); the base installation serves without it.
reranker = ["sentence-transformers", "torch"]
# Browser flows of tools/verify.py (local verification service).
verify = ["playwright"]

[project.scripts]
rfp-assistant = "rfp_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
