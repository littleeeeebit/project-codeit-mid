name: bidmate-postgresql
services:
  database:
    # linux/amd64 manifest of pgvector/pgvector:0.8.6-pg18, resolved 2026-10-03.
    image: pgvector/pgvector@sha256:1d50c689b0a6511b9ea0a15615281c81a59fd04a08eb35057ec8646fb3a2118a
    platform: linux/amd64
    # docker-init is PID 1 and reaps orphans. As PID 1 the postmaster would adopt any orphaned exec'd process (a
    # healthcheck killed at its timeout, an interrupted `docker exec`), treat its exit as a crashed backend and
    # restart the whole server.
    init: true
    environment:
      POSTGRES_DB: bidmate_rehearsal
      POSTGRES_USER: bidmate
      POSTGRES_PASSWORD: ${BIDMATE_POSTGRES_PASSWORD:?Run tools/infra/start-postgresql.ps1 first}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - database:/var/lib/postgresql
      - ./tools/infra/postgresql-init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bidmate", "-d", "bidmate_rehearsal"]  # no shell to leave an orphan
      interval: 5s
      timeout: 15s
      retries: 30
      start_period: 30s
    stop_grace_period: 60s
volumes:
  database:
