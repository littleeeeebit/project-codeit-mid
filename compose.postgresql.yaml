name: bidmate-postgresql
services:
  database:
    # linux/amd64 manifest of pgvector/pgvector:0.8.6-pg18, resolved 2026-10-03.
    image: pgvector/pgvector@sha256:1d50c689b0a6511b9ea0a15615281c81a59fd04a08eb35057ec8646fb3a2118a
    platform: linux/amd64
    environment:
      POSTGRES_DB: bidmate_rehearsal
      POSTGRES_USER: bidmate
      POSTGRES_PASSWORD: ${BIDMATE_POSTGRES_PASSWORD:?Run tools/start-postgresql.ps1 first}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - database:/var/lib/postgresql
      - ./tools/postgresql-init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidmate -d bidmate_rehearsal"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 60s
volumes:
  database:
